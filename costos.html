<title>Costos Una Montañita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: app de celular en una columna centrada, barra de navegación fija abajo, encabezado verde oliva como la tienda */
:root{
  --oliva:#2C3424; --oliva-2:#3d4733; --crema:#F4F2ED; --papel:#FFFFFF;
  --dorado:#C9A859; --dorado-claro:#FDF6E3; --tierra:#816B4E; --tinta:#2C372F;
  --linea:#E3DED2; --rojo:#A3392D; --rojo-claro:#FDECEA; --verde:#4E6B2E; --verde-claro:#EEF2E4;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--crema);color:var(--tinta)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
.top{background:var(--oliva);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;flex:1;text-wrap:balance}
.back{background:none;border:0;color:#fff;font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;line-height:1.1}
.sub{color:var(--tierra);font-size:13px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tierra);font-weight:500}
.card{background:var(--papel);border-radius:14px;padding:14px}
.big{display:flex;align-items:center;gap:14px;border:0;border-radius:16px;padding:18px 16px;text-align:left;cursor:pointer;width:100%;background:var(--oliva);color:#fff}
.big.gold{background:var(--dorado);color:var(--oliva)}
.big .ico{font-size:26px;width:34px;text-align:center}
.big b{display:block;font-weight:500;font-size:17px}
.big small{opacity:.8;font-size:12px}
.aviso{background:var(--dorado-claro);border:1px solid var(--dorado);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tierra)}
.aviso.rojo{background:var(--rojo-claro);border-color:#e7b9b2;color:var(--rojo)}
.list{background:var(--papel);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linea);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .n{font-weight:500;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--verde-claro);color:var(--verde)}
.pill.bajo{background:var(--dorado-claro);color:var(--tierra)}
.pill.mal{background:var(--rojo-claro);color:var(--rojo)}
.pill.sin{background:var(--crema);color:var(--tierra)}
.field{display:flex;flex-direction:column;gap:5px}
.in{background:var(--papel);border:1px solid #D6CFBE;border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.in:focus{outline:2px solid var(--dorado);outline-offset:1px;border-color:var(--dorado)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1.5px solid var(--oliva);background:transparent;border-radius:10px;padding:11px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;cursor:pointer;color:var(--oliva);text-align:center}
.btn.fill{background:var(--oliva);color:#fff}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn.mini{padding:7px 10px;font-size:11px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1}
.res{background:var(--oliva);color:#fff;border-radius:16px;padding:16px;text-align:center}
.res .label{color:var(--dorado)}
.res .grande{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.05}
.res .sub{color:#d9d5c9}
.linea{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--linea)}
.linea:last-child{border-bottom:0}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--linea)}
.bar i{display:block}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tierra)}
.ley span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.seg{display:flex;background:var(--papel);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;color:var(--tierra)}
.seg button.on{background:var(--dorado);color:var(--oliva);font-weight:500}
input[type=range]{width:100%;accent-color:var(--oliva)}
.comp{display:grid;grid-template-columns:minmax(0,1fr) 88px 30px;gap:8px;align-items:center}
.x{border:0;background:none;color:var(--rojo);font-size:20px;cursor:pointer;padding:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;font-size:11px;color:#9a917f;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--oliva);font-weight:500}
nav.tabs button.on svg{color:var(--dorado)}
.velo{position:fixed;inset:0;background:rgba(28,33,23,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.hoja{background:var(--crema);border-radius:18px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--oliva);color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.err{color:var(--rojo);font-size:13px}
textarea.in{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sube .25s ease-out}@keyframes sube{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<header class="top"><div class="top-in" id="top"></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Secciones"><div class="in2" id="tabs"></div></nav>
<div id="capa"></div>

<script>
const KEY='montanita-costos-v1';
const UN={g:{base:'g',f:1,txt:'gramos'},kg:{base:'g',f:1000,txt:'kilos'},ml:{base:'ml',f:1,txt:'mililitros'},l:{base:'ml',f:1000,txt:'litros'},u:{base:'u',f:1,txt:'unidades'}};
const CATS=['Yerba / materia prima','Packaging','Etiquetas y stickers','Regalo','Envío','Otro'];
const uid=()=>Math.random().toString(36).slice(2,9);

function ejemplo(){
  const i=(nombre,cat,precio,cantidad,unidad,merma=0)=>({id:uid(),nombre,cat,precio,cantidad,unidad,merma,anterior:null,fecha:Date.now()});
  const yb=i('Yerba Baldo 1 kg','Yerba / materia prima',6600,1,'kg',3);
  const b5=i('Bolsa kraft 500 g','Packaging',15000,100,'u');
  const b1=i('Bolsa kraft 1 kg','Packaging',22000,100,'u');
  const st=i('Sticker logo','Etiquetas y stickers',8000,200,'u');
  const rg=i('Regalo sorpresa','Regalo',10000,20,'u');
  const mt=i('Mate calabaza artesanal','Otro',85000,10,'u');
  const cj=i('Caja para mate','Packaging',12000,10,'u');
  yb.anterior=0.006*1000;
  return {ejemplo:true,
    insumos:[yb,b5,b1,st,rg,mt,cj],
    productos:[
      {id:uid(),nombre:'Yerba 500 g',items:[{i:yb.id,c:500},{i:b5.id,c:1},{i:st.id,c:2},{i:rg.id,c:1}],extras:[],margen:40,precio:7490},
      {id:uid(),nombre:'Yerba 1 kg + regalo',items:[{i:yb.id,c:1000},{i:b1.id,c:1},{i:st.id,c:2},{i:rg.id,c:1}],extras:[],margen:35,precio:13990},
      {id:uid(),nombre:'Mate calabaza',items:[{i:mt.id,c:1},{i:cj.id,c:1},{i:st.id,c:1}],extras:[{n:'Curado y armado',m:500}],margen:35,precio:12500}
    ],
    cfg:{comision:5,margenMin:25,club:5,redondeo:'90',nombre:'Gonzalo'}};
}
function vacio(){return {ejemplo:false,insumos:[],productos:[],cfg:{comision:5,margenMin:25,club:5,redondeo:'90',nombre:'Gonzalo'}}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.insumos)S=ejemplo();
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const plata=n=>(n<0?'-$':'$')+nf0.format(Math.abs(Math.round(n)));
const plataFina=n=>{const a=Math.abs(n);const d=a<10?2:a<100?1:0;return '$'+new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(a)};
const pct=n=>nf0.format(Math.round(n))+'%';
const num=v=>{const x=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(x)?x:0};
const numDec=v=>{const s=String(v).trim();const x=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s);return isFinite(x)?x:0};

const ins=id=>S.insumos.find(x=>x.id===id);
const prod=id=>S.productos.find(x=>x.id===id);
const costoBase=i=>{const q=i.cantidad*UN[i.unidad].f;return q>0?i.precio/q:0};
const baseU=i=>UN[i.unidad].base;
function costoItem(it){const i=ins(it.i);if(!i)return 0;return it.c*costoBase(i)*(1+(i.merma||0)/100)}
function costo(p){return p.items.reduce((s,it)=>s+costoItem(it),0)+p.extras.reduce((s,e)=>s+(+e.m||0),0)}
function redondear(x){
  const r=S.cfg.redondeo;
  if(r==='90')return Math.ceil((x+10)/100)*100-10;
  if(r==='100')return Math.ceil(x/100)*100;
  return Math.ceil(x);
}
function sugerido(c,margen){const d=1-margen/100-S.cfg.comision/100;return d>0?redondear(c/d):null}
function ganancia(precio,c){return precio*(1-S.cfg.comision/100)-c}
function margenReal(precio,c){return precio>0?ganancia(precio,c)/precio*100:0}
function estado(p){
  const c=costo(p);
  if(!p.precio)return {cls:'sin',txt:'Sin precio'};
  const m=margenReal(p.precio,c);
  if(m<0)return {cls:'mal',txt:'Perdés '+pct(-m),m};
  if(m<S.cfg.margenMin)return {cls:'bajo',txt:'Ganás '+pct(m),m};
  return {cls:'ok',txt:'Ganás '+pct(m),m};
}

const ICON={
  casa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  bolsa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>',
  ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'
};
const TABS=[['inicio','Inicio','casa'],['insumos','Compras','bolsa'],['productos','Productos','caja'],['precio','Precio','tag'],['ajustes','Ajustes','ajustes']];

let V={vista:'inicio'};
function ir(vista,extra={}){V={vista,...extra};render();window.scrollTo(0,0)}
function cabecera(t,atras){$('#top').innerHTML=(atras?`<button class="back" aria-label="Volver" onclick="${atras}">&#8592;</button>`:'<span style="font-size:20px" aria-hidden="true">&#9650;</span>')+`<h1>${esc(t)}</h1>`}
function render(){
  const tabActual={inicio:'inicio',compra:'insumos',insumos:'insumos',productos:'productos',producto:'productos',precio:'precio',ajustes:'ajustes'}[V.vista];
  $('#tabs').innerHTML=TABS.map(([k,t,ic])=>`<button class="${k===tabActual?'on':''}" onclick="ir('${k}')" aria-label="${t}">${ICON[ic]}<span>${t}</span></button>`).join('');
  ({inicio:vInicio,insumos:vInsumos,compra:vCompra,productos:vProductos,producto:vProducto,precio:vPrecio,ajustes:vAjustes})[V.vista]();
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confirmar(titulo,texto,si,accion){
  $('#capa').innerHTML=`<div class="velo" onclick="if(event.target===this)cerrarCapa()"><div class="hoja" role="dialog" aria-modal="true"><h2 style="font-size:22px">${esc(titulo)}</h2><div class="sub" style="font-size:14px">${esc(texto)}</div><div class="btns"><button class="btn" onclick="cerrarCapa()">Cancelar</button><button class="btn fill" id="si">${esc(si)}</button></div></div></div>`;
  $('#si').onclick=()=>{cerrarCapa();accion()};
}
function cerrarCapa(){$('#capa').innerHTML=''}
const avisoEjemplo=()=>S.ejemplo?`<div class="aviso">Estos son datos de ejemplo para que veas cómo funciona. <button class="btn mini" style="margin-top:8px;width:100%" onclick="empezarCero()">Borrar ejemplo y empezar con mis datos</button></div>`:'';
function empezarCero(){confirmar('¿Empezar de cero?','Se borran los insumos y productos de ejemplo. Tus ajustes quedan igual.','Empezar',()=>{const c=S.cfg;S=vacio();S.cfg=c;guardar();ir('inicio');toast('Listo, cargá tu primera compra')})}

/* ---------- INICIO ---------- */
function vInicio(){
  cabecera('Mis costos');
  const malos=S.productos.filter(p=>{const e=estado(p);return e.cls==='mal'||e.cls==='bajo'});
  const sin=S.productos.filter(p=>!p.precio);
  $('#app').innerHTML=`
  <div><h2>Hola, ${esc(S.cfg.nombre||'')}</h2><div class="sub" style="font-size:14px">¿Qué querés hacer hoy?</div></div>
  <button class="big" onclick="ir('compra',{id:null})"><span class="ico">${ICON.bolsa}</span><span><b>Cargué una compra</b><small>Yerba, bolsas, stickers, regalos</small></span></button>
  <button class="big gold" onclick="ir('precio',{id:null})"><span class="ico">${ICON.tag}</span><span><b>¿A cuánto lo vendo?</b><small>Calculá el precio de un producto</small></span></button>
  ${malos.length?`<div class="aviso rojo"><b style="font-weight:500">${malos.length===1?'1 producto gana':malos.length+' productos ganan'} menos de ${pct(S.cfg.margenMin)}.</b> Revisá su precio: ${malos.map(p=>esc(p.nombre)).join(', ')}.</div>`:''}
  ${sin.length?`<div class="aviso">${sin.length===1?'1 producto no tiene':sin.length+' productos no tienen'} precio puesto todavía.</div>`:''}
  ${avisoEjemplo()}
  <div class="label">Tus productos</div>
  ${S.productos.length?`<div class="list">${S.productos.map(p=>{const c=costo(p),e=estado(p);return `<button class="item" onclick="ir('precio',{id:'${p.id}'})"><div class="grow"><div class="n">${esc(p.nombre)}</div><div class="sub num">Te sale ${plata(c)}${p.precio?' · lo vendés '+plata(p.precio):''}</div></div><span class="pill ${e.cls}">${e.txt}</span></button>`}).join('')}</div>`
  :`<div class="card"><b style="font-weight:500">Todavía no armaste productos.</b><div class="sub">Primero cargá lo que comprás y después armá cada producto con sus partes.</div><button class="btn fill" style="margin-top:10px;width:100%" onclick="ir('producto',{id:null})">Armar un producto</button></div>`}`;
}

/* ---------- INSUMOS ---------- */
function vInsumos(){
  cabecera('Lo que compro');
  const q=(V.q||'').toLowerCase();
  const lista=S.insumos.filter(i=>i.nombre.toLowerCase().includes(q));
  $('#app').innerHTML=`
  <button class="btn fill" onclick="ir('compra',{id:null})">+ Cargar una compra</button>
  <input class="in" id="buscar" placeholder="Buscar: yerba, bolsa, sticker…" value="${esc(V.q||'')}" oninput="V.q=this.value;filtrarInsumos()">
  <div id="listaIns">${listaInsumos(lista)}</div>
  <div class="sub">Tocá cualquiera para actualizar el precio cuando vuelvas a comprar.</div>`;
}
function listaInsumos(lista){
  if(!S.insumos.length)return `<div class="card"><b style="font-weight:500">Cargá tu primera compra.</b><div class="sub">Por ejemplo: la yerba, las bolsas o los stickers.</div></div>`;
  if(!lista.length)return `<div class="card sub">No encontré nada con ese nombre.</div>`;
  return CATS.map(cat=>{const g=lista.filter(i=>i.cat===cat);if(!g.length)return '';
    return `<div class="label" style="margin:10px 0 6px">${cat}</div><div class="list">${g.map(i=>`<button class="item" onclick="ir('compra',{id:'${i.id}'})"><div class="grow"><div class="n">${esc(i.nombre)}</div><div class="sub num">${plata(i.precio)} por ${nf0.format(i.cantidad)} ${UN[i.unidad].txt}${i.merma?' · merma '+i.merma+'%':''}</div></div><div class="num" style="text-align:right"><b style="font-weight:500">${plataFina(costoBase(i))}</b><div class="sub">por ${baseU(i)==='u'?'unidad':baseU(i)}</div></div></button>`).join('')}</div>`}).join('');
}
function filtrarInsumos(){const q=(V.q||'').toLowerCase();$('#listaIns').innerHTML=listaInsumos(S.insumos.filter(i=>i.nombre.toLowerCase().includes(q)))}

/* ---------- CARGAR COMPRA ---------- */
function vCompra(){
  const i=V.id?ins(V.id):null;
  cabecera(i?'Actualizar compra':'Cargué una compra',"ir('insumos')");
  const opts=S.insumos.map(x=>`<option value="${x.id}" ${i&&i.id===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('');
  $('#app').innerHTML=`
  ${S.insumos.length?`<div class="field"><label class="label" for="elegir">¿Ya lo compraste antes?</label><select class="in" id="elegir" onchange="ir('compra',{id:this.value||null})"><option value="">No, es algo nuevo</option>${opts}</select></div>`:''}
  <div class="field"><label class="label" for="cNombre">¿Qué compraste?</label><input class="in" id="cNombre" placeholder="Yerba Baldo 1 kg" value="${esc(i?.nombre||'')}" oninput="previewCompra()"></div>
  <div class="field"><label class="label" for="cCat">¿Qué es?</label><select class="in" id="cCat">${CATS.map(c=>`<option ${i?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="field"><label class="label" for="cPrecio">¿Cuánto pagaste en total?</label><input class="in num" id="cPrecio" inputmode="numeric" placeholder="6.600" value="${i?nf0.format(i.precio):''}" oninput="previewCompra()"></div>
  <div class="field"><span class="label">¿Cuánto vino?</span><div class="row2"><input class="in num" id="cCant" inputmode="decimal" aria-label="Cantidad" placeholder="1" value="${i?String(i.cantidad).replace('.',','):''}" oninput="previewCompra()"><select class="in" id="cUni" aria-label="Unidad" onchange="previewCompra()">${Object.entries(UN).map(([k,u])=>`<option value="${k}" ${(i?.unidad||'u')===k?'selected':''}>${u.txt}</option>`).join('')}</select></div></div>
  <div class="field"><label class="label" for="cMerma">¿Cuánto se pierde al usarlo? (merma)</label><div class="row2"><input class="in num" id="cMerma" inputmode="decimal" placeholder="0" value="${i?.merma||''}" oninput="previewCompra()"><span class="sub" style="align-self:center">% · ej: la yerba que se cae al fraccionar</span></div></div>
  <div id="prev"></div>
  <div class="err" id="cErr"></div>
  <button class="btn fill" onclick="guardarCompra()">Guardar</button>
  ${i?`<button class="btn peligro" onclick="borrarInsumo('${i.id}')">Borrar este insumo</button>`:''}`;
  previewCompra();
}
function leerCompra(){return {nombre:$('#cNombre').value.trim(),cat:$('#cCat').value,precio:num($('#cPrecio').value),cantidad:numDec($('#cCant').value),unidad:$('#cUni').value,merma:numDec($('#cMerma').value)}}
function previewCompra(){
  $('#cErr').textContent='';
  const d=leerCompra(),i=V.id?ins(V.id):null;
  if(!(d.precio>0&&d.cantidad>0)){$('#prev').innerHTML='';return}
  const nuevo=costoBase(d),u=UN[d.unidad].base,uTxt=u==='u'?'cada unidad':'cada '+(u==='g'?'gramo':'mililitro');
  let cambio='';
  if(i){const viejo=costoBase(i);if(viejo>0&&Math.abs(nuevo-viejo)/viejo>0.001){const v=(nuevo-viejo)/viejo*100;cambio=`<div class="sub" style="color:${v>0?'var(--rojo)':'var(--verde)'}">Antes ${plataFina(viejo)} · ${v>0?'subió':'bajó'} ${pct(Math.abs(v))}</div>`}}
  let afect='';
  if(i){
    const ps=S.productos.filter(p=>p.items.some(it=>it.i===i.id));
    if(ps.length){
      const copia={...i,...d};
      afect=`<div class="label" style="margin-top:4px">Productos que cambian</div><div class="list">${ps.map(p=>{
        const antes=costo(p);const idx=S.insumos.indexOf(i);S.insumos[idx]=copia;const desp=costo(p);S.insumos[idx]=i;
        const sug=sugerido(desp,p.margen);
        const mr=p.precio?margenReal(p.precio,desp):null;
        return `<div class="item" style="cursor:default"><div class="grow"><div class="n">${esc(p.nombre)}</div><div class="sub num">Te sale ${plata(antes)} → ${plata(desp)}</div>${p.precio?`<div class="sub num">Con tu precio ${plata(p.precio)} ganás ${pct(mr)}</div>`:''}</div><div class="num" style="text-align:right"><div class="sub">Conviene</div><b style="font-weight:500">${sug?plata(sug):'—'}</b></div></div>`}).join('')}</div>`;
    }
  }
  $('#prev').innerHTML=`<div class="card" style="text-align:center"><div class="sub">Te sale ${uTxt}</div><div style="font-family:var(--serif);font-size:34px;font-weight:600" class="num">${plataFina(nuevo)}</div>${d.merma?`<div class="sub">Con la merma del ${d.merma}%: ${plataFina(nuevo*(1+d.merma/100))}</div>`:''}${cambio}</div>${afect}`;
}
function guardarCompra(){
  const d=leerCompra();
  if(!d.nombre){$('#cErr').textContent='Escribí qué compraste.';return}
  if(!(d.precio>0)){$('#cErr').textContent='Poné cuánto pagaste en total.';return}
  if(!(d.cantidad>0)){$('#cErr').textContent='Poné cuánto vino (por ejemplo 1 kilo o 100 unidades).';return}
  if(V.id){const i=ins(V.id);
    if(UN[i.unidad].base!==UN[d.unidad].base&&S.productos.some(p=>p.items.some(it=>it.i===i.id))){$('#cErr').textContent='Este insumo ya se usa en productos con otra unidad. Usá la misma unidad (o creá uno nuevo).';return}
    i.anterior=costoBase(i);Object.assign(i,d,{fecha:Date.now()});
  }else S.insumos.push({id:uid(),...d,anterior:null,fecha:Date.now()});
  guardar();toast('Compra guardada');ir('insumos');
}
function borrarInsumo(id){
  const usos=S.productos.filter(p=>p.items.some(it=>it.i===id));
  confirmar('¿Borrar este insumo?',usos.length?`Se usa en: ${usos.map(p=>p.nombre).join(', ')}. Se va a quitar de esos productos.`:'No se usa en ningún producto.','Borrar',()=>{
    S.insumos=S.insumos.filter(x=>x.id!==id);S.productos.forEach(p=>p.items=p.items.filter(it=>it.i!==id));guardar();toast('Insumo borrado');ir('insumos')});
}

/* ---------- PRODUCTOS ---------- */
function vProductos(){
  cabecera('Mis productos');
  $('#app').innerHTML=`
  <button class="btn fill" onclick="ir('producto',{id:null})">+ Armar un producto</button>
  ${S.productos.length?`<div class="list">${S.productos.map(p=>{const e=estado(p);return `<button class="item" onclick="ir('producto',{id:'${p.id}'})"><div class="grow"><div class="n">${esc(p.nombre)}</div><div class="sub num">${p.items.length} partes · te sale ${plata(costo(p))}</div></div><span class="pill ${e.cls}">${e.txt}</span></button>`}).join('')}</div>`
  :`<div class="card"><b style="font-weight:500">Armá tu primer producto.</b><div class="sub">Elegís qué lleva (yerba, bolsa, sticker, regalo) y cuánto de cada cosa. La app suma todo sola.</div></div>`}
  <div class="sub">Tocá un producto para cambiar lo que lleva.</div>`;
}
let BORR=null;
function vProducto(){
  if(!BORR||BORR._para!==V.id){const p=V.id?prod(V.id):null;BORR=p?JSON.parse(JSON.stringify(p)):{id:null,nombre:'',items:[],extras:[],margen:40,precio:0};BORR._para=V.id}
  const p=BORR;
  cabecera(p.id?'Editar producto':'Armar producto',"BORR=null;ir('productos')");
  if(!S.insumos.length){$('#app').innerHTML=`<div class="card"><b style="font-weight:500">Primero cargá lo que comprás.</b><div class="sub">Un producto se arma con tus compras: yerba, bolsas, stickers.</div><button class="btn fill" style="margin-top:10px;width:100%" onclick="ir('compra',{id:null})">Cargar una compra</button></div>`;return}
  const opt=sel=>S.insumos.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.nombre)}</option>`).join('');
  $('#app').innerHTML=`
  <div class="field"><label class="label" for="pNombre">Nombre del producto</label><input class="in" id="pNombre" placeholder="Yerba 500 g" value="${esc(p.nombre)}" oninput="BORR.nombre=this.value"></div>
  <div class="label">¿Qué lleva?</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    ${p.items.length?p.items.map((it,k)=>{const i=ins(it.i);return `<div><div class="comp"><select class="in" aria-label="Insumo" onchange="BORR.items[${k}].i=this.value;vProducto()">${opt(it.i)}</select><input class="in num" aria-label="Cantidad" inputmode="decimal" value="${String(it.c).replace('.',',')}" oninput="BORR.items[${k}].c=numDec(this.value);totProd()"><button class="x" aria-label="Quitar" onclick="BORR.items.splice(${k},1);vProducto()">&times;</button></div><div class="sub num" style="margin-top:3px">${i?(baseU(i)==='u'?'unidades':baseU(i)==='g'?'gramos':'mililitros'):''} · <span id="ci${k}">${plata(costoItem(it))}</span></div></div>`}).join(''):'<div class="sub">Agregá la primera parte: por ejemplo la yerba.</div>'}
    <button class="btn mini" onclick="BORR.items.push({i:S.insumos[0].id,c:1});vProducto()">+ Agregar parte</button>
  </div>
  <div class="label">Otros gastos por paquete <span style="text-transform:none;letter-spacing:0">(mano de obra, envío local)</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    ${p.extras.map((e,k)=>`<div class="comp"><input class="in" aria-label="Concepto" placeholder="Envío local" value="${esc(e.n)}" oninput="BORR.extras[${k}].n=this.value"><input class="in num" aria-label="Monto" inputmode="numeric" placeholder="$" value="${e.m?nf0.format(e.m):''}" oninput="BORR.extras[${k}].m=num(this.value);totProd()"><button class="x" aria-label="Quitar" onclick="BORR.extras.splice(${k},1);vProducto()">&times;</button></div>`).join('')}
    <button class="btn mini" onclick="BORR.extras.push({n:'',m:0});vProducto()">+ Agregar gasto</button>
  </div>
  <div class="res"><div class="label">Te sale hacerlo</div><div class="grande num" id="pTot">${plata(costo(p))}</div></div>
  <div class="err" id="pErr"></div>
  <div class="btns"><button class="btn fill" onclick="guardarProducto(false)">Guardar</button><button class="btn" onclick="guardarProducto(true)">Guardar y poner precio</button></div>
  ${p.id?`<button class="btn peligro" onclick="borrarProducto('${p.id}')">Borrar producto</button>`:''}`;
}
function totProd(){$('#pTot').textContent=plata(costo(BORR));BORR.items.forEach((it,k)=>{const e=$('#ci'+k);if(e)e.textContent=plata(costoItem(it))})}
function guardarProducto(aPrecio){
  const p=BORR;
  if(!p.nombre.trim()){$('#pErr').textContent='Ponele un nombre al producto.';return}
  if(!p.items.length&&!p.extras.length){$('#pErr').textContent='Agregá al menos una parte.';return}
  const limpio={id:p.id||uid(),nombre:p.nombre.trim(),items:p.items.filter(it=>it.c>0),extras:p.extras.filter(e=>e.n||e.m),margen:p.margen,precio:p.precio};
  const k=S.productos.findIndex(x=>x.id===limpio.id);if(k>=0)S.productos[k]=limpio;else S.productos.push(limpio);
  guardar();BORR=null;toast('Producto guardado');
  aPrecio?ir('precio',{id:limpio.id}):ir('productos');
}
function borrarProducto(id){confirmar('¿Borrar este producto?','Tus compras no se borran.','Borrar',()=>{S.productos=S.productos.filter(x=>x.id!==id);guardar();BORR=null;toast('Producto borrado');ir('productos')})}

/* ---------- PRECIO ---------- */
function vPrecio(){
  cabecera('¿A cuánto lo vendo?');
  if(!S.productos.length){$('#app').innerHTML=`<div class="card"><b style="font-weight:500">Primero armá un producto.</b><div class="sub">Así sé cuánto te sale hacerlo.</div><button class="btn fill" style="margin-top:10px;width:100%" onclick="ir('producto',{id:null})">Armar un producto</button></div>`;return}
  if(!V.id||!prod(V.id))V.id=S.productos[0].id;
  if(!V.modo)V.modo='margen';
  const p=prod(V.id);
  if(V.tent===undefined)V.tent=p.precio||'';
  $('#app').innerHTML=`
  <select class="in" id="selProd" aria-label="Producto" onchange="ir('precio',{id:this.value,modo:V.modo})">${S.productos.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>
  <div class="seg" role="tablist"><button class="${V.modo==='margen'?'on':''}" onclick="V.modo='margen';vPrecio()">Quiero ganar un %</button><button class="${V.modo==='precio'?'on':''}" onclick="V.modo='precio';vPrecio()">Ya tengo un precio</button></div>
  <div class="card">
    <div class="linea"><span class="sub" style="font-size:14px">Te sale hacerlo</span><b class="num" style="font-weight:500">${plata(costo(p))}</b></div>
    ${V.modo==='margen'?`<div style="padding-top:10px"><div class="linea" style="border:0;padding:0"><label class="sub" style="font-size:14px" for="rMar">Quiero ganar</label><b class="num" style="font-weight:500" id="oMar">${pct(p.margen)}</b></div><input type="range" id="rMar" min="0" max="80" step="1" value="${p.margen}" oninput="prod(V.id).margen=+this.value;guardar();calcPrecio()"></div>`
    :`<div class="field" style="padding-top:10px"><label class="sub" style="font-size:14px" for="tent">Precio que estás pensando</label><input class="in num" id="tent" inputmode="numeric" placeholder="7.000" value="${V.tent?nf0.format(V.tent):''}" oninput="V.tent=num(this.value);calcPrecio()"></div>`}
    <div style="padding-top:10px"><div class="linea" style="border:0;padding:0"><label class="sub" style="font-size:14px" for="rCom">Comisión de cobro</label><b class="num" style="font-weight:500" id="oCom">${pct(S.cfg.comision)}</b></div><input type="range" id="rCom" min="0" max="20" step="0.5" value="${S.cfg.comision}" oninput="S.cfg.comision=+this.value;guardar();calcPrecio()"></div>
  </div>
  <div id="resPrecio"></div>`;
  calcPrecio();
}
function calcPrecio(){
  const p=prod(V.id),c=costo(p);
  const om=$('#oMar');if(om)om.textContent=pct(p.margen);
  $('#oCom').textContent=(S.cfg.comision%1?S.cfg.comision.toString().replace('.',','):S.cfg.comision)+'%';
  let precio,titulo;
  if(V.modo==='margen'){precio=sugerido(c,p.margen);titulo='Precio que pongo';
    if(precio===null){$('#resPrecio').innerHTML=`<div class="aviso rojo">La ganancia más la comisión no pueden sumar 100% o más. Bajá alguna de las dos.</div>`;return}}
  else{precio=V.tent;titulo='Con ese precio';
    if(!(precio>0)){$('#resPrecio').innerHTML=`<div class="aviso">Escribí un precio para ver cuánto ganás.</div>`;return}}
  const g=ganancia(precio,c),m=margenReal(precio,c),com=precio*S.cfg.comision/100;
  const club=precio*(1-S.cfg.club/100),gClub=ganancia(club,c);
  const w=x=>Math.max(0,x/precio*100).toFixed(1)+'%';
  const yaPuesto=p.precio===precio;
  $('#resPrecio').innerHTML=`
  <div class="res"><div class="label">${titulo}</div><div class="grande num">${plata(precio)}</div><div class="sub" style="font-size:15px">${g>=0?'Ganás '+plata(g)+' por paquete ('+pct(m)+')':'Perdés '+plata(-g)+' por paquete'}</div></div>
  ${g>=0?`<div class="bar" aria-hidden="true"><i style="width:${w(c)};background:var(--tierra)"></i><i style="width:${w(com)};background:var(--rojo)"></i><i style="width:${w(g)};background:var(--dorado)"></i></div>
  <div class="ley"><span style="--c:var(--tierra)">Costo ${plata(c)}</span><span style="--c:var(--rojo)">Comisión ${plata(com)}</span><span style="--c:var(--dorado)">Tu ganancia ${plata(g)}</span></div>`:''}
  ${V.modo==='precio'&&g>=0&&m<S.cfg.margenMin?`<div class="aviso">Ganás menos del ${pct(S.cfg.margenMin)} que te pusiste como mínimo.</div>`:''}
  <div class="card"><div class="linea"><span class="sub" style="font-size:14px">Si usa el ${pct(S.cfg.club)} del Club (3ra compra)</span><b class="num" style="font-weight:500">${plata(club)}</b></div><div class="linea"><span class="sub" style="font-size:14px">Ahí ganás</span><b class="num" style="font-weight:500;color:${gClub<0?'var(--rojo)':'inherit'}">${plata(gClub)}</b></div>${p.precio&&!yaPuesto?`<div class="linea"><span class="sub" style="font-size:14px">Precio que tenés puesto hoy</span><b class="num" style="font-weight:500">${plata(p.precio)}</b></div>`:''}</div>
  <button class="btn fill" onclick="ponerPrecio(${precio})" ${yaPuesto?'aria-disabled="true"':''}>${yaPuesto?'Es tu precio actual':'Usar este precio'}</button>
  <button class="btn" onclick="ir('producto',{id:'${p.id}'})">Ver qué lleva el producto</button>`;
}
function ponerPrecio(x){const p=prod(V.id);if(p.precio===x){toast('Ya es tu precio');return}p.precio=x;guardar();toast('Precio guardado: '+plata(x));calcPrecio()}

/* ---------- AJUSTES ---------- */
function vAjustes(){
  cabecera('Ajustes');
  const c=S.cfg;
  $('#app').innerHTML=`
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label class="label" for="aNom">Tu nombre</label><input class="in" id="aNom" value="${esc(c.nombre)}" oninput="S.cfg.nombre=this.value;guardar()"></div>
    <div class="row2">
      <div class="field"><label class="label" for="aCom">Comisión de cobro %</label><input class="in num" id="aCom" inputmode="decimal" value="${String(c.comision).replace('.',',')}" oninput="S.cfg.comision=numDec(this.value);guardar()"></div>
      <div class="field"><label class="label" for="aMin">Avisarme si gano menos de %</label><input class="in num" id="aMin" inputmode="decimal" value="${c.margenMin}" oninput="S.cfg.margenMin=numDec(this.value);guardar()"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="label" for="aClub">Descuento del Club %</label><input class="in num" id="aClub" inputmode="decimal" value="${c.club}" oninput="S.cfg.club=numDec(this.value);guardar()"></div>
      <div class="field"><label class="label" for="aRed">Redondear precios</label><select class="in" id="aRed" onchange="S.cfg.redondeo=this.value;guardar()"><option value="90" ${c.redondeo==='90'?'selected':''}>Terminados en 90</option><option value="100" ${c.redondeo==='100'?'selected':''}>A los 100</option><option value="no" ${c.redondeo==='no'?'selected':''}>Sin redondear</option></select></div>
    </div>
  </div>
  <div class="label">Respaldo de tus datos</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="sub" style="font-size:14px">Tus datos se guardan en este navegador. Hacé un respaldo cada tanto, o para pasarlos del celu a la compu.</div>
    <div class="btns"><button class="btn" onclick="exportar()">Guardar respaldo</button><button class="btn" onclick="$('#archivo').click()">Abrir respaldo</button></div>
    <input type="file" id="archivo" accept=".json,application/json" hidden onchange="importarArchivo(this)">
    <div id="zonaResp"></div>
  </div>
  ${S.ejemplo?avisoEjemplo():`<button class="btn peligro" onclick="confirmar('¿Borrar todo?','Se borran todas tus compras y productos de este navegador. Hacé un respaldo antes si querés guardarlos.','Borrar todo',()=>{const c=S.cfg;S=vacio();S.cfg=c;guardar();ir('inicio');toast('Datos borrados')})">Borrar todos mis datos</button>`}`;
}
function exportar(){
  const txt=JSON.stringify({app:'costos-una-montanita',fecha:new Date().toISOString(),datos:S});
  let bajo=false;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='respaldo-costos-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();bajo=true}catch(e){}
  $('#zonaResp').innerHTML=`<div class="sub">Si no se descargó un archivo, copiá este texto y guardalo (por ejemplo en WhatsApp o en una nota):</div><textarea class="in" id="txtResp" readonly>${esc(txt)}</textarea><button class="btn mini" onclick="copiar()">Copiar texto</button><div class="label" style="margin-top:6px">Para restaurar pegando el texto</div><textarea class="in" id="txtImp" placeholder="Pegá acá un respaldo"></textarea><button class="btn mini" onclick="importarTexto($('#txtImp').value)">Restaurar desde el texto</button><div class="err" id="impErr"></div>`;
}
function copiar(){const t=$('#txtResp');try{navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>{t.select();toast('Seleccionado: copialo')})}catch(e){t.select();toast('Seleccionado: copialo')}}
function importarArchivo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importarTexto(r.result);r.readAsText(f);inp.value=''}
function importarTexto(txt){
  try{const o=JSON.parse(txt);const d=o.datos||o;if(!d.insumos||!d.productos)throw 0;
    confirmar('¿Restaurar este respaldo?',`Tiene ${d.insumos.length} insumos y ${d.productos.length} productos. Reemplaza lo que tenés ahora.`,'Restaurar',()=>{S=d;S.ejemplo=false;guardar();ir('inicio');toast('Respaldo restaurado')});
  }catch(e){const er=$('#impErr');if(er)er.textContent='Ese texto no es un respaldo válido.';else toast('Ese archivo no es un respaldo válido')}
}

render();
</script>
